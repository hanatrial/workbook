<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#F3EEE5" />
<title>Detail SO &amp; Item</title>
<meta property="og:title" content="Detail SO &amp; Item — Ship Monitor" />
<meta property="og:description" content="Isi SO, qty, dan status realisasi per kapal." />
<meta property="og:image" content="https://hanatrial.github.io/workbook/icons/icon-192.png" />
<link rel="apple-touch-icon" href="https://hanatrial.github.io/workbook/icons/icon-192.png" />
<style>
  :root{
    --bg:#F3EEE5; --card:#FFFDF9; --ink:#221D18; --muted:#6B6055;
    --brand:#0B6B5E; --line:rgba(34,29,24,.10);
    --danger:#C63A47; --warn:#B5771A; --ok:#137A5A; --sand:#EFE8DA;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
    letter-spacing:-.01em;padding:20px 16px 40px}
  .wrap{max-width:640px;margin:0 auto}
  .top{display:flex;align-items:flex-start;gap:10px;margin-bottom:16px}
  .top h1{font-size:21px;margin:0;line-height:1.25;letter-spacing:-.02em}
  .top .m{font-size:12.5px;color:var(--muted);margin-top:4px}
  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(11,107,94,.12);color:var(--brand);white-space:nowrap}
  .btn{border:none;background:var(--brand);color:#fff;font:inherit;font-weight:700;font-size:13.5px;
    padding:11px 16px;border-radius:14px;width:100%;cursor:pointer}
  .btn.ghost{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
  .btn:active{transform:scale(.99)}
  .card{background:var(--card);border-radius:20px;padding:16px 16px 14px;margin-bottom:12px;
    box-shadow:inset 0 0 0 1px var(--line),0 10px 26px -20px rgba(34,29,24,.5)}
  .site{font-size:14px;font-weight:700;line-height:1.35}
  .meta{font-size:12px;color:var(--muted);margin-top:3px}
  details.card{padding:0}
  details.card>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 16px 14px}
  details.card>summary::-webkit-details-marker{display:none}
  .sum-r{display:flex;align-items:center;gap:8px;flex:none}
  .cnt{font-size:11px;font-weight:700;color:var(--muted)}
  .chev{width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .18s;margin-top:-3px}
  details[open]>summary .chev{transform:rotate(-135deg);margin-top:3px}
  details.card .body{padding:0 16px 14px}
  .it{padding:11px 0;border-top:1px solid var(--line)}
  .it:first-of-type{margin-top:10px}
  .it .cd{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .it b{font-size:12.5px}
  .it .nm{font-size:12.5px;margin-top:2px;line-height:1.4}
  .it .qt{font-size:12px;color:var(--muted);margin-top:3px}
  .pill{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
  .pill.ok{background:rgba(19,122,90,.14);color:var(--ok)}
  .pill.no{background:rgba(198,58,71,.12);color:var(--danger)}
  .pill.mid{background:rgba(181,119,26,.14);color:var(--warn)}
  .miss{font-size:11.5px;color:var(--danger);margin-top:2px}
  .empty,.err{background:var(--card);border-radius:16px;padding:18px;font-size:13px;color:var(--muted);
    box-shadow:inset 0 0 0 1px var(--line);text-align:center;line-height:1.5}
  .foot{font-size:11px;color:var(--muted);text-align:center;margin-top:16px;line-height:1.6}
  .foot a{color:var(--brand);text-decoration:none;font-weight:600}
  .actions{display:none;gap:8px;margin:14px 0 18px}
  .search{position:sticky;top:0;z-index:5;background:var(--bg);padding:2px 0 12px;display:none}
  .search .f{position:relative}
  .search input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:0;
    border-radius:14px;padding:12px 44px 12px 14px;box-shadow:inset 0 0 0 1px var(--line);outline:none;-webkit-appearance:none}
  .search input:focus{box-shadow:inset 0 0 0 2px var(--brand)}
  .search input::-webkit-search-cancel-button{display:none}
  .search .x{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:none;color:var(--muted);font-size:17px;cursor:pointer;display:none}
  .search .hit{font-size:11.5px;color:var(--muted);margin-top:6px}
  .search .hit:empty{display:none}
  mark{background:rgba(181,119,26,.28);color:inherit;border-radius:3px;padding:0 1px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,14px);background:#221D18;color:#fff;
    padding:10px 16px;border-radius:999px;font-size:12.5px;font-weight:600;opacity:0;transition:.25s;pointer-events:none}
  .toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div style="flex:1">
      <h1 id="title">Detail SO &amp; Item</h1>
      <div class="m" id="sub">Memuat…</div>
    </div>
    <span class="badge" id="count" style="display:none"></span>
  </div>
  <div class="search" id="search">
    <div class="f">
      <input type="search" id="q" placeholder="Cari nama atau kode item…" autocomplete="off" enterkeyhint="search" aria-label="Cari item" />
      <button type="button" class="x" id="qx" aria-label="Hapus pencarian">✕</button>
    </div>
    <div class="hit" id="hit"></div>
  </div>
  <div id="body"><div class="empty">Memuat data…</div></div>
  <div class="foot">
    Sumber: portal distributor · <a href="https://hanatrial.github.io/workbook/">buka app Keluarga Sultan</a>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
var DB='https://workbook-ks-default-rtdb.asia-southeast1.firebasedatabase.app';
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('on')},1900)}
var HR=['Min','Sen','Sel','Rab','Kam','Jum','Sab'], MO=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
function fd(s){if(!s)return'—';var d=new Date(s+'T00:00:00');if(isNaN(d))return s;return HR[d.getDay()]+' '+d.getDate()+' '+MO[d.getMonth()]+' '+d.getFullYear()}
function stCls(st){var t=String(st||'');if(/penuh/i.test(t))return['ok',t];if(/tidak/i.test(t))return['no',t];return t?['mid',t]:['mid','—']}
function get(p){return fetch(DB+p).then(function(r){return r.json()})}
function par(){var o={};(location.search||'').replace(/^\?/,'').split('&').forEach(function(kv){if(!kv)return;var i=kv.indexOf('=');var k=decodeURIComponent(i<0?kv:kv.slice(0,i)),v=decodeURIComponent(i<0?'':kv.slice(i+1));o[k]=v});return o}

var card=null;

function build(vessel){
  var lines=(vessel.lines||[]).filter(function(l){return l&&l.soNo});
  return Promise.all(lines.map(function(l){
    return get('/soItems/'+encodeURIComponent(l.soNo)+'.json').then(function(o){return o}).catch(function(){return null})
  })).then(function(details){
    return {
      vessel:vessel.vessel||'—',
      eta:vessel.eta||'',
      destinations:vessel.destinations||'',
      sos:lines.map(function(l,i){
        var d=details[i]||null;
        return {
          site:l.site||'—', so:String(l.soNo), container:l.containerSize||'',
          items:(d&&d.items)||[], hasDetail:!!(d&&d.items&&d.items.length)
        };
      })
    };
  });
}

var QRY='';
function norm(s){return String(s==null?'':s).toLowerCase().replace(/\s+/g,' ').trim()}
function hl(s){
  var t=String(s==null?'':s);if(!QRY)return esc(t);
  var i=t.toLowerCase().replace(/\s/g,' ').indexOf(QRY);if(i<0)return esc(t);
  return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+QRY.length))+'</mark>'+esc(t.slice(i+QRY.length));
}
function match(it){return !QRY||norm(it.name).indexOf(QRY)>=0||norm(it.code).indexOf(QRY)>=0}

function itemHtml(it){
  var s=stCls(it.itemStatus||it.status), miss=Number(it.unrealized)>0;
  return '<div class="it"><div class="cd"><b>'+(it.code?hl(it.code):'—')+'</b><span class="pill '+s[0]+'">'+esc(s[1])+'</span></div>'
    +'<div class="nm">'+hl(it.name||'')+'</div>'
    +'<div class="qt">'+(Number(it.qty)||0)+' '+esc(it.uom||'')+'</div>'
    +(miss?'<div class="miss">'+Number(it.unrealized)+' '+esc(it.uom||'')+' tidak terpenuhi</div>':'')+'</div>'
}

function render(data){
  card=data;
  $('title').textContent=data.vessel;
  $('sub').innerHTML='ETA '+esc(fd(data.eta))+(data.destinations?' · '+esc(data.destinations):'');
  $('count').style.display='';
  $('count').textContent=data.sos.length+' SO';
  $('search').style.display=data.sos.some(function(s){return s.hasDetail})?'block':'none';
  if(!data.sos.length){
    $('body').innerHTML='<div class="empty">Kapal ini belum punya nomor SO. Detail item belum bisa ditampilkan.</div>';
    return;
  }
  renderList();
}

function renderList(){
  var data=card, nItem=0, nSo=0;
  var html=data.sos.map(function(s){
    var items=s.items.filter(match);
    if(QRY&&!items.length)return '';
    if(QRY){nItem+=items.length;nSo++}
    var head='<div><div class="site">'+esc(s.site)+'</div>'
      +'<div class="meta">SO '+esc(s.so)+(s.container?' · '+esc(s.container):'')+'</div></div>';
    if(!s.hasDetail)
      return '<div class="card">'+head+'<div class="it"><div class="qt">Detail item belum ada di portal.</div></div></div>';
    // klik untuk buka/tutup daftar item (dropdown); kalau hanya satu SO, langsung terbuka
    return '<details class="card"'+(data.sos.length===1||QRY?' open':'')+'><summary>'+head
      +'<span class="sum-r"><span class="cnt">'+(QRY?items.length+' dari ':'')+s.items.length+' item</span><i class="chev"></i></span></summary>'
      +'<div class="body">'+items.map(itemHtml).join('')+'</div></details>';
  }).join('');
  $('hit').textContent=QRY&&nItem?nItem+' item cocok di '+nSo+' SO':'';
  $('body').innerHTML=html||'<div class="empty">Tidak ada item yang cocok dengan “'+esc($('q').value.trim())+'”.</div>';
}

$('q').addEventListener('input',function(){
  QRY=norm(this.value);$('qx').style.display=this.value?'block':'none';
  if(card)renderList();
});
$('qx').addEventListener('click',function(){var q=$('q');q.value='';QRY='';this.style.display='none';if(card)renderList();q.focus()});

/* ---------- boot ---------- */
(function(){
  var q=par(), id=q.v, so=q.so;
  if(!id&&!so){
    $('sub').textContent='Link tidak lengkap';
    $('body').innerHTML='<div class="err">Link ini belum menyertakan kapal atau nomor SO.<br>Minta ulang link-nya dari admin.</div>';
    return;
  }
  if(so){
    get('/soItems/'+encodeURIComponent(so)+'.json').then(function(d){
      if(!d){ $('body').innerHTML='<div class="err">SO '+esc(so)+' belum ada detail itemnya.</div>'; $('sub').textContent='Detail SO'; return }
      render({vessel:'SO '+so,eta:d.eta||'',destinations:d.site||'',
        sos:[{site:d.site||'—',so:so,container:'',items:d.items||[],hasDetail:!!(d.items||[]).length}]});
    }).catch(function(){ $('body').innerHTML='<div class="err">Gagal memuat data. Cek koneksi lalu coba lagi.</div>' });
    return;
  }
  get('/shipments/'+encodeURIComponent(id)+'.json').then(function(v){
    if(!v||!v.vessel){ $('body').innerHTML='<div class="err">Kapal tidak ditemukan. Link mungkin sudah usang.</div>'; return }
    return build(v).then(render);
  }).catch(function(){ $('body').innerHTML='<div class="err">Gagal memuat data. Cek koneksi lalu coba lagi.</div>' });
})();
</script>
</body>
</html>
