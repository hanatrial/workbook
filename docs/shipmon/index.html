<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07182b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/ship-192.png">
<link rel="apple-touch-icon" href="icons/ship-apple-touch.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ship">
<title>Ship Monitor</title>
<style>
:root{--bg:#07182b;--card:rgba(255,255,255,.06);--ink:#eaf2fa;--mut:#8fa9c2;--line:rgba(255,255,255,.1);--sail:#38bdf8;--soon:#ff6a2b;--bad:#ff4d5e;--ok:#34d399;--brand:#ff6a2b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.4 system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--ink);padding:0 14px 40px;max-width:520px;margin:auto;min-height:100vh}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(120% 60% at 80% -10%,#0f5a8a 0,transparent 60%),linear-gradient(180deg,#0a2b49 0,#07182b 45%)}
header{padding:22px 0 14px;position:relative}
.hl{display:flex;align-items:center;gap:12px}
.hl img{width:44px;height:44px;border-radius:12px}
h1{font-size:24px;line-height:1.1;margin:0;letter-spacing:-.3px}
.tg{color:var(--mut);font-size:12.5px;margin-top:2px}
.rt{position:absolute;right:0;top:24px;text-align:right}
#sync{font-size:11px;color:var(--mut)}
button{font:inherit;border:0;cursor:pointer}
#rf{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px 10px;color:var(--ink);display:block;margin:4px 0 0 auto}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 12px}
.kpi button{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 4px;color:var(--ink);backdrop-filter:blur(6px)}
.kpi b{display:block;font-size:26px;font-weight:800}
.kpi small{font-size:11px;color:var(--mut)}
.kpi .on{background:var(--brand);border-color:var(--brand);box-shadow:0 6px 20px rgba(255,106,43,.35)}
.kpi .on small{color:#fff}
select{width:100%;padding:12px;margin-bottom:12px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit}
select option{color:#000}
.c{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;position:relative;overflow:hidden;backdrop-filter:blur(6px)}
.c:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sail)}
.c.soon:before{background:var(--soon)}.c.late:before{background:var(--bad)}.c.done:before{background:var(--ok)}.c.done{opacity:.75}
.t{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;font-weight:800;font-size:16px}
.d{font-size:11.5px;font-weight:800;white-space:nowrap;padding:4px 10px;border-radius:999px;background:rgba(56,189,248,.15);color:var(--sail)}
.soon .d{background:rgba(255,106,43,.18);color:var(--soon)}.late .d{background:rgba(255,77,94,.18);color:var(--bad)}.done .d{background:rgba(52,211,153,.15);color:var(--ok)}
.m{font-size:12.5px;color:var(--mut);margin-top:4px}
.dt{display:flex;gap:6px;margin-top:10px;font-size:12.5px;font-weight:700}
.dt span{flex:1;background:rgba(255,255,255,.06);border-radius:12px;padding:7px 9px}
.dt i{display:block;font-style:normal;font-size:9.5px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:12px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px}.sg button{padding:9px;border-radius:999px;background:none;color:var(--mut);font-weight:700;font-size:13.5px;white-space:nowrap}.sg .on{background:var(--brand);color:#fff}
.so{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;font-size:12.5px}.c.open .so{display:block}.c{cursor:pointer}
.so>b{display:block;margin-top:8px;font-size:12px;color:var(--sail)}.so .sr{display:flex;justify-content:space-between;gap:6px;padding:3px 0;font-variant-numeric:tabular-nums}.so s{color:var(--ok);text-decoration:none}
.sr{cursor:pointer}.sr .ar{font-style:normal;color:var(--mut);margin-left:4px}
.its{margin:4px 0 8px;padding:8px 10px;background:rgba(0,0,0,.18);border-radius:10px}
.ld{color:var(--mut);font-size:11.5px;padding:4px 0}
.it{display:flex;gap:8px;padding:5px 0;border-top:1px solid var(--line);align-items:flex-start}
.ld + .it{border-top:0}
.it b{font-size:10.5px;color:var(--sail);min-width:74px;font-weight:800;padding-top:1px}
.it span{flex:1;font-size:11.5px;line-height:1.25}
.it em{font-style:normal;font-size:11px;color:var(--ink);white-space:nowrap;text-align:right}
.it small{display:block;font-size:9.5px;color:var(--mut);margin-top:2px}
.it small.ok{color:var(--ok)}.it small.part{color:var(--soon)}
.ic{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.ic .t{display:flex;justify-content:space-between;gap:8px;font-weight:800;font-size:14px}
.ic .t .d{font-size:11px;font-weight:700;color:var(--sail);background:rgba(56,189,248,.15);padding:3px 9px;border-radius:999px;white-space:nowrap}
.ic .n{font-size:11.5px;color:var(--mut);margin-top:3px}
.ic .r{margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
.ir{display:flex;gap:8px;padding:5px 0;border-top:1px solid var(--line);align-items:flex-start;font-size:11.5px}
.ir:first-child{border-top:0;padding-top:0}
.ir b{color:var(--sail);font-size:11px;flex:0 0 40%;line-height:1.25}
.ir span{flex:1;color:var(--ink);line-height:1.25}
.ir span u{text-decoration:none;color:var(--mut);display:block;font-size:10.5px;margin-top:2px}
.ir em{font-style:normal;color:var(--ink);white-space:nowrap}
.ir small{display:block;color:var(--mut);font-size:9.5px;margin-top:2px}
details{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}summary{font-weight:800;cursor:pointer}summary small{display:block;font-weight:400;color:var(--mut);font-size:12px;margin-top:3px}
.og{font-size:12px;font-weight:800;color:var(--soon);margin:14px 2px 8px;text-transform:uppercase;letter-spacing:.08em}table{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:8px}td,th{padding:5px 3px;text-align:left;border-top:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:600}tr.tr td{opacity:.5}
#q,#iq{width:100%;padding:12px 14px;margin-bottom:10px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit}#q::placeholder,#iq::placeholder{color:var(--mut)}
.el{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.m u{text-decoration:none;color:var(--sail);font-weight:700}
.gh{font-size:12px;font-weight:800;color:var(--mut);margin:14px 2px 8px;text-transform:uppercase;letter-spacing:.06em}.gh.bad{color:var(--bad)}
.sc{margin-top:10px;padding:10px;border-radius:14px;background:rgba(255,255,255,.05)}.sc.tr{opacity:.5}.sh{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.sh b{font-size:13.5px}.sh em{font-style:normal;font-size:11px;color:var(--mut);margin-left:auto}.cr{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;background:rgba(255,106,43,.18);color:var(--soon)}
.e{text-align:center;color:var(--mut);padding:30px 0}
</style>
</head>
<body>
<header><div class="hl"><img src="icons/ship-192.png" alt=""><div><h1>Ship Monitor</h1><div class="tg">Pantau kapal &amp; SO Sulawesi</div></div></div><div class="rt"><span id="sync"></span><button id="rf">↻</button></div></header>
<div class="sg" id="mode"><button data-m="m" class="on">Monitor</button><button data-m="j">Jadwal Kapal</button><button data-m="i">Item</button></div>
<div id="mon"><div class="kpi" id="kpi"></div>
<input id="q" type="search" placeholder="Cari no SO, kapal, atau customer…" autocomplete="off">
<select id="site"></select>
<div id="list"><div class="e">Memuat…</div></div></div>
<div id="jad" style="display:none"></div>
<div id="itm" style="display:none"><input id="iq" type="search" placeholder="Cari item, kapal, SO, atau distributor…" autocomplete="off"><select id="isite"></select><div id="ilist"><div class="e">Memuat item…</div></div></div>
<script>
var DB='https://workbook-ks-default-rtdb.asia-southeast1.firebasedatabase.app/shipments.json',K='shipMonitor',tab='sail',data=[];
var ROOT=DB.replace('/shipments.json',''),IT=ROOT+'/soItems';
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function day(s){return s?new Date(s+'T00:00:00'):null}
function today(){var d=new Date();d.setHours(0,0,0,0);return d}
function arrived(s){if(s.status==='Sudah Sampai')return true;if(s.status==='Belum Sampai')return false;var e=day(s.eta);return !!e&&e<=today()}
function dd(s){return Math.round((day(s.eta)-today())/864e5)}
var HR=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
function fd(s){if(!s)return'—';var d=day(s);return HR[d.getDay()]+' '+d.getDate()+' '+['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][d.getMonth()]}
function sites(s){var a=[];(s.lines||[]).forEach(function(l){if(l.site&&a.indexOf(l.site)<0)a.push(l.site)});if(!a.length&&s.destinations)a=s.destinations.split(',').map(function(x){return x.trim()}).filter(Boolean);return a}
function kind(s){if(arrived(s))return'done';if(!s.eta)return'sail';var n=dd(s);return n<0?'late':n<=3?'soon':'sail'}
function label(s,k){if(k==='done')return'Sampai';if(!s.eta)return'';var n=dd(s);return n<0?'Telat '+(-n)+'h':n===0?'Hari ini':'H-'+n}
function card(s,open){var k=kind(s),L=s.lines||[],n=L.length,st=sites(s),x=L[0]||{},qq=$('q').value.trim().toLowerCase();
  var o=open||(qq&&L.some(function(l){return String(l.soNo||'').toLowerCase().indexOf(qq)>=0}));
  return'<div class="c '+k+(o?' open':'')+'"><div class="t"><span>'+esc(s.vessel)+'</span><span class="d">'+label(s,k)+'</span></div>'
  +'<div class="m el">📍 '+esc(st[0]||'-')+(st.length>1?' <u>+'+(st.length-1)+' tujuan</u>':'')+'</div>'
  +(x.shippingLine?'<div class="m">🚚 '+esc(x.shippingLine)+(n?' · '+n+' SO':'')+'</div>':'')
  +'<div class="dt"><span><i>Closing</i>'+fd(s.closing)+'</span><span><i>ETD</i>'+fd(s.etd)+'</span><span><i>ETA</i>'+fd(s.eta)+'</span></div>'+(n?'<div class="m">▾ No SO ('+n+')</div><div class="so">'+soHtml(L)+'</div>':'')+'</div>'}
function hit(s,qq){var h=[s.vessel,s.destinations].concat((s.lines||[]).map(function(l){return[l.soNo,l.site,l.containerNo,l.container].join(' ')})).join(' ').toLowerCase();return h.indexOf(qq)>=0}
function render(){
  var q=$('site').value,qq=$('q').value.trim().toLowerCase(),w=today().getTime()-7*864e5;
  var all=data.filter(function(s){return !q||sites(s).indexOf(q)>=0});
  var c={sail:0,soon:0,done:0};
  all.forEach(function(s){var k=kind(s);if(k==='done'){if(!s.eta||day(s.eta)>=w)c.done++}else{c.sail++;if(k==='soon')c.soon++}});
  $('kpi').innerHTML=[['sail','Berlayar',c.sail],['soon','Tiba ≤3 hari',c.soon],['done','Sampai 7h',c.done]].map(function(x){return'<button data-t="'+x[0]+'" class="'+(!qq&&tab===x[0]?'on':'')+'"><b>'+x[2]+'</b><small>'+x[1]+'</small></button>'}).join('');
  var asc=function(a,b){return(a.eta||'9999')<(b.eta||'9999')?-1:1},out='';
  if(qq){var r=all.filter(function(s){return hit(s,qq)}).sort(asc);out='<div class="gh">Hasil cari ('+r.length+')</div>'+r.map(function(s){return card(s)}).join('')}
  else if(tab==='done'){var d=all.filter(function(s){return kind(s)==='done'&&(!s.eta||day(s.eta)>=w)}).sort(function(a,b){return asc(b,a)});out=d.map(function(s){return card(s)}).join('')}
  else if(tab==='soon'){out=all.filter(function(s){var k=kind(s);return k==='soon'||k==='late'}).sort(asc).map(function(s){return card(s)}).join('')}
  else{var lt=all.filter(function(s){return kind(s)==='late'}).sort(asc),sl=all.filter(function(s){var k=kind(s);return k==='sail'||k==='soon'}).sort(asc);
    out=(lt.length?'<div class="gh bad">⚠ Perlu dicek — ETA lewat, belum ditandai sampai ('+lt.length+')</div>'+lt.map(function(s){return card(s)}).join(''):'')+(sl.length?'<div class="gh">Berlayar ('+sl.length+')</div>'+sl.map(function(s){return card(s)}).join(''):'')}
  $('list').innerHTML=out||'<div class="e">Tidak ada kapal</div>';
}
var MN={jan:0,feb:1,mar:2,apr:3,mei:4,may:4,jun:5,jul:6,agu:7,aug:7,sep:8,okt:9,oct:9,nov:10,des:11,dec:11};
function wd(t){var m=/^(\d{1,2}) ([A-Za-z]{3})[a-z]*(?: (\d{4}))?/.exec(t);if(!m)return t;var mo=MN[m[2].toLowerCase()];if(mo==null)return t;var y=m[3]?+m[3]:new Date().getFullYear(),d=new Date(y,mo,+m[1]);return HR[d.getDay()]+' '+t}
function soHtml(L){var g={},o=[];L.forEach(function(l){var k=l.site||'-';(g[k]=g[k]||[]).push(l)});for(var k in g)o.push('<b>'+esc(k)+'</b>'+g[k].map(function(l){return'<div class="sr" data-so="'+esc(l.soNo||'')+'"><span>'+esc(l.soNo||'-')+'</span><span>'+esc(l.containerSize||'')+(l.arrived?' <s>✓</s>':'')+' <i class="ar">›</i></span></div>'}).join(''));return o.join('')}
function itemHtml(o){if(!o||!o.items||!o.items.length)return'<div class="ld">Tidak ada item di portal.</div>';var h='<div class="ld">'+o.items.length+' item'+(o.cmo?' · '+esc(o.cmo):'')+(o.dates&&o.dates.estimate?' · est. sampai '+esc(o.dates.estimate):'')+'</div>';o.items.forEach(function(it){var st=it.itemStatus||it.status||'';h+='<div class="it"><b>'+esc(it.code||'-')+'</b><span>'+esc(it.name||'')+'<small class="'+(/penuh/i.test(st)?'ok':'part')+'">'+esc(st)+'</small></span><em>'+esc(it.qty)+' '+esc(it.uom||'')+'</em></div>'});return h}
function toggleItems(row){var so=row.getAttribute('data-so');if(!so)return;var nx=row.nextElementSibling;if(nx&&nx.className==='its'){nx.remove();return}var box=document.createElement('div');box.className='its';box.innerHTML='<div class="ld">Memuat item…</div>';row.parentNode.insertBefore(box,row.nextSibling);var key='soItem:'+so;try{var c=JSON.parse(localStorage.getItem(key));if(c&&c.items&&Date.now()-(c.fetchedAt||0)<216e5){box.innerHTML=itemHtml(c);return}}catch(e){}fetch(IT+'/'+so+'.json').then(function(r){return r.json()}).then(function(o){if(!o||!o.items){box.innerHTML='<div class="ld">Detail item belum ada di portal.</div>';return}try{localStorage.setItem(key,JSON.stringify(o))}catch(e){}box.innerHTML=itemHtml(o)}).catch(function(){box.innerHTML='<div class="ld">Gagal memuat item.</div>'})}
var IK='soItemAll',iData=null,iIndex=null;
function ibuild(o){var m={};Object.keys(o||{}).forEach(function(so){var s=o[so];(s.items||[]).forEach(function(it){var k=it.code||it.name;if(!k)return;var g=m[k]=m[k]||{code:it.code||'',name:it.name||'',qty:0,rows:[]};if(it.name)g.name=it.name;g.rows.push({vessel:s.vessel||'-',site:s.site||'-',so:so,eta:s.eta||'',qty:it.qty||0,uom:it.uom||'',st:it.itemStatus||it.status||''});g.qty+=it.qty||0})});return Object.keys(m).map(function(k){return m[k]})}
function isitefill(){var set={};iIndex.forEach(function(g){g.rows.forEach(function(r){set[r.site]=1})});var cur=$('isite').value;$('isite').innerHTML='<option value="">Semua distributor</option>'+Object.keys(set).sort().map(function(x){return'<option>'+esc(x)+'</option>'}).join('');$('isite').value=cur}
function iload(force){var c=null;try{c=JSON.parse(localStorage.getItem(IK))}catch(e){}if(c&&c.data&&!force&&Date.now()-(c.at||0)<216e5){iData=c.data;iIndex=ibuild(iData);isitefill();irender();return}if(!c||!c.data)$('ilist').innerHTML='<div class="e">Memuat item…</div>';fetch(ROOT+'/soItems.json').then(function(r){return r.json()}).then(function(o){iData=o||{};iIndex=ibuild(iData);isitefill();try{localStorage.setItem(IK,JSON.stringify({at:Date.now(),data:iData}))}catch(e){}irender()}).catch(function(){if(c&&c.data){iData=c.data;iIndex=ibuild(iData);isitefill();irender()}else $('ilist').innerHTML='<div class="e">Gagal memuat item</div>'})}
function isum(rows){var s=0;rows.forEach(function(r){s+=r.qty||0});return s}
function norm(s){return String(s==null?'':s).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function iloc(rows){var m={};rows.forEach(function(r){var k=r.vessel+'|'+r.site;var x=m[k]=m[k]||{vessel:r.vessel,site:r.site,so:[],qty:0,uom:r.uom,eta:r.eta,st:''};if(x.so.indexOf(r.so)<0)x.so.push(r.so);x.qty+=r.qty||0;if(r.st&&r.st!=='Terealisasi Penuh')x.st=r.st;if(!x.eta||(r.eta&&r.eta<x.eta))x.eta=r.eta});return Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return a.vessel.localeCompare(b.vessel)||a.site.localeCompare(b.site)})}
function icard(g,rows){var loc=iloc(rows),sos={},h='<div class="ic"><div class="t"><span>'+esc(g.code||'-')+'</span><span class="d">';rows.forEach(function(r){sos[r.so]=1});h+=Object.keys(sos).length+' SO</span></div><div class="n">'+esc(g.name)+'</div><div class="r">';loc.forEach(function(l){h+='<div class="ir"><b>'+esc(l.vessel)+'</b><span>'+esc(l.site)+'<u>'+l.so.slice(0,3).map(function(x){return esc(x)}).join(' · ')+(l.so.length>3?' +'+(l.so.length-3):'')+'</u><small>'+esc(fd(l.eta))+(l.st&&l.st!=='Terealisasi Penuh'?' · '+esc(l.st):'')+'</small></span><em>'+esc(l.qty)+' '+esc(l.uom)+'</em></div>'});return h+'</div></div>'}
function irender(){if(!iIndex){$('ilist').innerHTML='<div class="e">Memuat item…</div>';return}var q=norm($('iq').value),site=$('isite').value,out=[];iIndex.forEach(function(g){var hit=norm(g.code+' '+g.name).indexOf(q)>=0;var rr=g.rows.filter(function(r){if(site&&r.site!==site)return false;if(q.length<2||hit)return true;return norm(r.vessel+' '+r.site+' '+r.so).indexOf(q)>=0});if(rr.length)out.push({g:g,rows:rr})});out.sort(function(a,b){return isum(b.rows)-isum(a.rows)});var head='',total=out.length;if(q.length<2&&!site){head='<div class="gh">Item terbanyak</div>';out=out.slice(0,8)}else{head=total?'<div class="gh">'+total+' item'+(site?' · '+esc(site):'')+(total>20?' · 20 ditampilkan':'')+'</div>':'';out=out.slice(0,20)}$('ilist').innerHTML=out.length?(head+out.map(function(x){return icard(x.g,x.rows)}).join('')):'<div class="e">Tidak ada item</div>'}
function fill(){
  var set={};data.forEach(function(s){sites(s).forEach(function(x){set[x]=1})});
  var cur=$('site').value;
  $('site').innerHTML='<option value="">Semua site / distributor</option>'+Object.keys(set).sort().map(function(x){return'<option>'+esc(x)+'</option>'}).join('');
  $('site').value=cur;
}
function set(o){data=Object.keys(o||{}).map(function(k){return o[k]}).filter(function(s){return s&&s.vessel});fill();render()}
function load(){
  $('sync').textContent='…';
  fetch(DB).then(function(r){return r.json()}).then(function(o){
    try{localStorage.setItem(K,JSON.stringify(o))}catch(e){}
    set(o);var d=new Date();$('sync').textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)
  }).catch(function(){$('sync').textContent='offline'})

var JK='shipSched',jl=0;
