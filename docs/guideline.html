<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#FFFFFF" />
<meta name="description" content="Panduan operasional tim lapangan Keluarga Sultan." />
<title>Guideline - Keluarga Sultan</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  :root{
    --bg:#FFFFFF; --panel:#F7F7F7; --card:#FFFFFF;
    --ink:#1F1F1F; --muted:#6E6E6E; --line:#EAEAEA; --line-strong:#DCDCDC;
    --green:#93C90F; --green-ink:#334A03; --green-soft:#F1F8DC; --green-soft-2:#E4F3BE; --green-line:#CBE78A;
    --field:#FFFFFF;
    --radius:12px; --radius-lg:16px; --pill:999px;
    --font:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg);-webkit-text-size-adjust:100%}
  body{
    margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
    font-family:var(--font);font-size:15px;line-height:1.5;letter-spacing:-.01em;
  }
  a{color:inherit}
  .wrap{width:100%;max-width:680px;margin:0 auto;padding:18px 18px 56px}

  .topbar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:2px 0 26px}
  .icon-btn{
    display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;
    flex:none;border:1px solid var(--line);border-radius:12px;background:var(--card);
    color:var(--ink);text-decoration:none;transition:border-color .2s var(--ease),background .2s var(--ease);
  }
  .icon-btn:hover{border-color:var(--green-line);background:#FCFEF7}
  .tag{
    display:inline-block;min-height:30px;padding:0 12px;line-height:30px;
    border-radius:var(--pill);background:var(--green-soft);color:var(--green-ink);
    font-size:11px;font-weight:700;letter-spacing:.02em;white-space:nowrap;
  }
  .tag.plain{background:var(--panel);color:var(--muted)}

  .masthead{padding:0 2px 24px}
  .masthead h1{
    margin:0;font-size:clamp(32px,9vw,40px);font-weight:700;line-height:1.1;letter-spacing:-.035em;
  }
  .lede{margin:10px 0 0;max-width:44ch;color:var(--muted);font-size:13.5px;line-height:1.55}

  .panel{
    margin-top:8px;padding:18px 14px 16px;background:var(--panel);
    border-radius:var(--radius-lg);
  }

  .search{
    display:flex;align-items:center;gap:4px;height:48px;padding:0 6px 0 14px;
    background:var(--field);border:1px solid var(--line-strong);border-radius:10px;
    transition:border-color .2s var(--ease),box-shadow .2s var(--ease);
  }
  .search:focus-within{border-color:var(--green);box-shadow:0 0 0 3px rgba(147,201,15,.18)}
  .search svg{flex:none;color:var(--muted)}
  .search input{
    flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;
    color:var(--ink);font-family:inherit;font-size:14px;letter-spacing:-.01em;
  }
  .search input::placeholder{color:var(--muted);opacity:.8}
  .clear-btn{
    flex:none;min-width:44px;height:44px;padding:0 10px;border:0;border-radius:8px;
    background:var(--green-soft);color:var(--green-ink);font-family:inherit;
    font-size:11.5px;font-weight:700;cursor:pointer;
  }
  .clear-btn:hover{background:var(--green-soft-2)}

  .list-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:22px 4px 10px}
  .list-head h2{margin:0;font-size:15px;font-weight:700;letter-spacing:-.02em}
  .count{color:var(--muted);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}

  .list{display:grid;grid-template-columns:1fr;gap:8px}
  .topic{
    display:flex;align-items:center;gap:12px;min-height:68px;padding:14px;
    text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    transition:border-color .2s var(--ease),background .2s var(--ease);
  }
  .topic:hover{border-color:var(--green-line);background:#FCFEF7}
  .topic:active{background:var(--green-soft)}
  .topic .num{
    flex:none;display:inline-flex;align-items:center;justify-content:center;
    width:34px;height:34px;border-radius:9px;background:var(--green-soft);color:var(--green-ink);
    font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;
  }
  .topic .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .topic .title{font-size:14.5px;font-weight:600;letter-spacing:-.015em;line-height:1.3}
  .topic .sub{color:var(--muted);font-size:12px;line-height:1.45}
  .topic .chev{flex:none;color:#8A8A8A}

  .topic .snip{display:block;margin-top:3px;color:var(--muted);font-size:12px;line-height:1.5}
  .topic mark{background:var(--green-soft-2);color:inherit;border-radius:3px;padding:0 1px}
  .count .approx{color:#8A6100}

  .noresult{
    margin:0;padding:28px 20px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);color:var(--muted);font-size:13px;text-align:center;
  }
  .noresult b{color:var(--ink);font-weight:600}

  .back{
    display:inline-flex;align-items:center;gap:6px;min-height:44px;margin:0 0 12px -6px;padding:0 6px;
    text-decoration:none;color:var(--muted);font-size:12.5px;font-weight:600;border-radius:8px;
    white-space:nowrap;
    transition:color .2s var(--ease);
  }
  .back:hover{color:var(--ink)}

  .detail-head{display:flex;flex-direction:column;align-items:flex-start}
  .detail-num{margin-bottom:12px;width:74px;padding:0;text-align:center}
  .detail-head h1{
    margin:0;width:100%;font-size:clamp(28px,8vw,36px);font-weight:700;line-height:1.15;letter-spacing:-.03em;
  }
  .detail-head h1:focus{outline:none}
  .detail-sub{margin:9px 0 0;max-width:52ch;color:var(--muted);font-size:13.5px}
  .rule{height:1px;margin:22px 0;background:var(--line)}

  .empty{
    padding:28px 22px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  }
  .empty-title{margin:0;font-size:16px;font-weight:700;letter-spacing:-.02em}
  .empty-copy{margin:6px 0 18px;max-width:44ch;color:var(--muted);font-size:13px}
  .empty-link{
    display:flex;align-items:center;justify-content:center;width:100%;min-height:44px;padding:0 18px;
    border-radius:var(--pill);background:var(--green);color:var(--green-ink);
    font-size:12.5px;font-weight:700;text-decoration:none;white-space:nowrap;
    transition:background .2s var(--ease);
  }
  .empty-link:hover{background:#A2D81B}

  .materi{max-width:68ch;font-size:14.5px}
  .materi h2{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:26px 0 8px}
  .materi h3{font-size:15px;font-weight:700;margin:20px 0 6px}
  .materi p{margin:0 0 12px}
  .materi ul,.materi ol{margin:0 0 14px;padding-left:20px}
  .materi li{margin-bottom:6px}
  .materi table{width:100%;border-collapse:collapse;margin:14px 0;font-size:13px}
  .materi th,.materi td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  .materi th{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}


  /* ---- Materi berformat: accordion bagian, kartu, alur langkah, catatan ---- */
  .materi .lead{margin:0 0 16px;color:var(--muted);font-size:13.5px}
  .materi details.sec{margin:0 0 10px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .materi details.sec>summary{
    list-style:none;display:flex;align-items:center;gap:12px;min-height:60px;padding:12px 14px;cursor:pointer;
    transition:background .2s var(--ease);
  }
  .materi details.sec>summary::-webkit-details-marker{display:none}
  .materi details.sec>summary:hover{background:#FCFEF7}
  .materi details.sec[open]>summary{background:var(--green-soft);border-bottom:1px solid var(--green-line)}
  .materi .sec-num{
    flex:none;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;
    border-radius:9px;background:var(--green-soft);color:var(--green-ink);font-size:12px;font-weight:700;
  }
  .materi details.sec[open] .sec-num{background:var(--green);}
  .materi .sec-title{flex:1;min-width:0;font-size:15px;font-weight:700;letter-spacing:-.02em;line-height:1.3}
  .materi .sec-title small{display:block;margin-top:2px;color:var(--muted);font-size:11.5px;font-weight:500;letter-spacing:0}
  .materi .sec-chev{flex:none;color:var(--muted);transition:transform .2s var(--ease)}
  .materi details.sec[open] .sec-chev{transform:rotate(180deg)}
  .materi .sec-body{padding:6px 14px 14px}
  .materi .sec-body h3{margin:18px 0 6px}
  .materi .sec-body h3:first-child{margin-top:12px}
  .materi .card{margin:10px 0;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
  .materi .card b.t{display:block;margin-bottom:4px;font-size:13.5px}
  .materi .card p:last-child,.materi .card ul:last-child{margin-bottom:0}
  .materi .flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;margin:10px 0;padding:0;list-style:none}
  .materi .flow li{
    flex:1 1 130px;margin:0;padding:10px 12px;background:var(--green-soft);border:1px solid var(--green-line);
    border-radius:10px;font-size:13px;line-height:1.4;counter-increment:fl;position:relative;
  }
  .materi .flow{counter-reset:fl}
  .materi .flow li::before{
    content:counter(fl);display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;margin-right:6px;
    border-radius:50%;background:var(--green);color:var(--green-ink);font-size:11px;font-weight:700;
  }
  .materi .flow li b{display:block;margin-bottom:2px}
  /* alur berurutan dengan panah: tumpuk ke bawah di HP, mendatar di layar lebar */
  .materi .flow.linear{flex-direction:column;gap:20px}
  .materi .flow.linear li{flex:none}
  .materi .flow.linear li:not(:last-child)::after{
    content:'\2193';position:absolute;left:50%;bottom:-20px;transform:translateX(-50%);
    width:20px;height:20px;line-height:20px;text-align:center;color:var(--green-ink);font-weight:700;
  }
  @media (min-width:700px){
    .materi .flow.linear{flex-direction:row;gap:26px}
    .materi .flow.linear li{flex:1 1 0}
    .materi .flow.linear li:not(:last-child)::after{
      content:'\2192';left:auto;bottom:auto;right:-23px;top:50%;transform:translateY(-50%);
    }
  }
  .materi ul.check{list-style:none;margin:0 0 14px;padding:0}
  .materi ul.check li{position:relative;margin:0 0 8px;padding:10px 12px 10px 40px;background:var(--panel);border:1px solid var(--line);border-radius:10px;font-size:13.5px}
  .materi ul.check li::before{content:'';position:absolute;left:13px;top:50%;width:16px;height:16px;margin-top:-8px;border:2px solid var(--green);border-radius:5px;background:#fff}
  .materi .note{margin:12px 0;padding:11px 14px;border-left:3px solid var(--green);background:var(--green-soft);border-radius:0 10px 10px 0;font-size:13.5px}
  .materi .note b.t{display:block;margin-bottom:3px;color:var(--green-ink);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
  .materi .note p:last-child,.materi .note ul:last-child{margin-bottom:0}
  .materi .warn{border-left-color:#C98A12;background:#FFF7E3}
  .materi .warn b.t{color:#7A5200}
  .materi .tbl-wrap{overflow-x:auto;margin:10px 0}
  .materi .tbl-wrap table{margin:0;min-width:480px}
  .materi figure.shot{margin:12px 0}
  .materi figure.shot img{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
  .materi figure.shot figcaption{margin-top:6px;color:var(--muted);font-size:11.5px}
  .materi .pill{display:inline-block;padding:1px 9px;border-radius:var(--pill);background:var(--green-soft);color:var(--green-ink);font-size:11.5px;font-weight:700}
  .materi .pill.y{background:#FFF1B8;color:#6B5400}
  .materi .pill.r{background:#FBE0E0;color:#8A1C1C}

  /* Pratinjau gambar: tampil di halaman ini (bukan tab baru) supaya selalu bisa kembali */
  .lightbox{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;background:rgba(15,15,15,.92)}
  .lb-bar{flex:none;display:flex;justify-content:flex-end;padding:10px 12px}
  .lb-close{
    min-width:44px;min-height:44px;padding:0 18px;border:0;border-radius:var(--pill);
    background:var(--green);color:var(--green-ink);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;
  }
  .lb-scroll{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:0 12px 24px}
  .lb-scroll img{display:block;width:max(100%,960px);max-width:none;height:auto;margin:0 auto;background:#fff;border-radius:8px}
  .lb-hint{margin:0;padding:0 14px 6px;color:#CFCFCF;font-size:11.5px;text-align:right}
  .materi figure.shot a{cursor:zoom-in}

  .site-foot{margin:40px 2px 0;color:var(--muted);font-size:11.5px}

  :focus-visible{outline:2px solid var(--green-ink);outline-offset:3px}
  [hidden]{display:none !important}

  @media (min-width:700px){
    .wrap{padding:28px 24px 72px}
    .panel{padding:20px 18px 18px}
    .list{grid-template-columns:1fr 1fr;gap:10px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important}
  }
  @media print{
    .lightbox{display:none !important}
    body{background:#fff}
    .topbar,.search,.back,.noresult{display:none !important}
    .wrap{max-width:none;padding:0}
    .panel{background:#fff;padding:0}
    .topic{break-inside:avoid}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="icon-btn" href="index.html" aria-label="Kembali ke Keluarga Sultan">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m15 18-6-6 6-6"></path>
      </svg>
    </a>
    <span class="tag">Keluarga Sultan</span>
    <span class="tag plain">Panduan internal</span>
  </div>

  <header class="masthead" id="masthead">
    <h1>Guideline</h1>
    <p class="lede">Kumpulan panduan operasional untuk tim lapangan. Pilih topik untuk buka.</p>
  </header>

  <main id="listView">
    <section class="panel">
      <div class="search">
        <input id="q" type="search" placeholder="Cari topik atau isi materi..." aria-label="Cari topik guideline" autocomplete="off" />
        <button type="button" class="clear-btn" id="clear" hidden>Hapus</button>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-3.5-3.5"></path>
        </svg>
      </div>

      <div class="list-head">
        <h2>Topik</h2>
        <span class="count" id="count" aria-live="polite"></span>
      </div>

      <div class="list" id="list"></div>
      <p class="noresult" id="noresult" hidden></p>
    </section>
  </main>

  <main id="detailView" hidden>
    <a class="back" href="#/">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m15 18-6-6 6-6"></path>
      </svg>
      Semua guideline
    </a>
    <header class="detail-head">
      <span class="tag detail-num" id="detailNum"></span>
      <h1 id="detailTitle" tabindex="-1"></h1>
      <p class="detail-sub" id="detailSub"></p>

    <div class="rule"></div>

  <p class="site-foot">Keluarga Sultan, Sulawesi</p>
</div>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Pratinjau gambar" hidden>
  <div class="lb-bar"><button type="button" class="lb-close" id="lbClose">Tutup</button></div>
  <p class="lb-hint">Geser untuk melihat bagian lain. Ketuk Tutup untuk kembali.</p>
  <div class="lb-scroll" id="lbScroll"><img id="lbImg" alt="" /></div>
</div>

<template data-materi="handle-dc"><!-- Isi materi Handle DC di sini. --></template>
<template data-materi="handle-igr">
<p class="lead">Ringkasan materi sharing handling Indogrosir. Berbasis pengalaman lapangan tim, jadi hasilnya bisa berbeda di area lain.</p>
<details class="sec" open><summary><span class="sec-num">1</span><span class="sec-title">Struktur<small>Siapa memutuskan apa di Indogrosir</small></span><svg class="sec-chev" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></summary><div class="sec-body"><h3>Struktur Indogrosir</h3>
<figure class="shot"><a href="guideline-img/igr-struktur.jpg" target="_blank" rel="noopener"><img src="guideline-img/igr-struktur.jpg" alt="Struktur Store Indogrosir dan HO Indomarco" loading="lazy" decoding="async"></a><figcaption>Store Indogrosir (kiri) dan HO Indomarco (kanan). Ketuk gambar untuk memperbesar.</figcaption></figure>
<h3>Jenis member Indogrosir</h3>
<figure class="shot"><a href="guideline-img/igr-member.jpg" target="_blank" rel="noopener"><img src="guideline-img/igr-member.jpg" alt="Jenis member Indogrosir: biru, merah, platinum" loading="lazy" decoding="async"></a><figcaption>Member biru (umum), merah (usaha retail dan lainnya), dan platinum.</figcaption></figure></div></details>
<details class="sec"><summary><span class="sec-num">2</span><span class="sec-title">Operasional<small>IGR Connect dan pemakaian data</small></span><svg class="sec-chev" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></summary><div class="sec-body"><h3>1. IGR Connect: data harian dari Indogrosir</h3>
<p>Web B2B <b>igrconnect.com</b> dipakai untuk operasional harian: menghitung stock level, estimasi PO, service level, dan insight market share.</p>
<figure class="shot"><a href="guideline-img/igr-connect.jpg" target="_blank" rel="noopener"><img src="guideline-img/igr-connect.jpg" alt="Menu IGR Connect" loading="lazy" decoding="async"></a><figcaption>Menu di IGR Connect. Ketuk gambar untuk memperbesar.</figcaption></figure>
<div class="note warn"><b class="t">Akses</b><ul>
<li>Minta username dan password ke KAM. Tidak dicantumkan di halaman ini.</li>
<li>Akun tidak bisa login lebih dari 1 device dalam waktu yang bersamaan.</li>
<li>Jangan sampai salah password. Salah 3 kali, akun harus direset oleh KAM.</li></ul></div>
<div class="tbl-wrap"><table>
<tr><th>Menu</th><th>Isi</th></tr>
<tr><td>Purchase Order</td><td>Data PO nasional periode 1 bulan, status Active, Expired, dan Received.</td></tr>
<tr><td>Purchase Receipt</td><td>Data BPB nasional selama 1 bulan.</td></tr>
<tr><td>Stock</td><td>Report stock store, stock retur, dan stock out.</td></tr>
<tr><td>Return Product</td><td>Nota retur yang terbit dalam 3 bulan terakhir.</td></tr>
<tr><td>Finance</td><td>Tukar faktur dan pembayaran dalam 3 bulan terakhir.</td></tr>
<tr><td>Service Level</td><td>Tingkat pemenuhan barang.</td></tr>
<tr><td>Selling In</td><td>Nilai penerimaan barang dan retur.</td></tr>
<tr><td>Selling Out</td><td>Nilai penjualan ke konsumen, keseluruhan maupun member merah.</td></tr>
<tr><td>Performance Total Supplier</td><td>Grafik Selling In, Selling Out, Service Level, dan trend member.</td></tr>
<tr><td>Market Share</td><td>Market share per kategori per brand dibanding kompetitor, tahun berjalan vs tahun sebelumnya, beserta pertumbuhannya.</td></tr>
</table></div>

<h3>2. Memakai data IGR Connect untuk operasional</h3>
<div class="card"><b class="t">a. Availability: stock level dan estimasi order</b>
<p>Gabungkan data <b>Selling Out</b> (rata-rata 3 bulan, AP3M) dengan <b>stock on hand</b> toko untuk mendapat stock level (%) per item, lalu hitung estimasi order ke buyer (berbasis data). Hasilnya biasanya dibagikan ke tim MDS untuk negosiasi PO dengan tim IGR.</p>
<figure class="shot"><a href="guideline-img/igr-availability.jpg" target="_blank" rel="noopener"><img src="guideline-img/igr-availability.jpg" alt="Contoh perhitungan stock level dan estimasi PO" loading="lazy" decoding="async"></a><figcaption>Contoh: data Selling Out dan Stock Store menjadi stock level dan estimasi PO.</figcaption></figure></div>
<div class="card"><b class="t">b. Monitoring service level</b>
<p>Dari data Service Level, cek item mana yang tidak terpenuhi. Lalu cek PO yang tidak terpenuhi di menu Purchasing Order. Jika stok sudah ready di provider/distributor, PIC bisa meminta PO pengganti ke SPV/Manager Indogrosir.</p>
<ul>

<script>
const TOPICS = [
  { id:'handle-dc', n:'01', title:'Handle DC', sub:'Service level dan B2B' },
  { id:'handle-igr', n:'02', title:'Handle IGR', sub:'B2B, PO, dan operasional' },
  { id:'handle-hypermart', n:'03', title:'Handle Hypermart', sub:'Account handling modern trade' },
  { id:'handle-lotte', n:'04', title:'Handle Lotte Shopping', sub:'Account handling modern trade' },
  { id:'listing-toko', n:'05', title:'Proses Listing ke Toko', sub:'Alur listing produk sampai aktif di toko' },
  { id:'claim-pbd', n:'06', title:'Kelengkapan Claim Promosi dan PBD', sub:'Dokumen dan syarat claim' },
  { id:'lra-pum', n:'07', title:'LRA dan PUM', sub:'Alur dan kelengkapan LRA serta PUM' },
  { id:'display-gt', n:'08', title:'Display GT', sub:'Rak jemuran, display WOW, dan hanger: cara eksekusi dan pajang' },
  { id:'asset-area', n:'09', title:'Serah Terima Asset Area', sub:'Dokumen yang diperlukan' },
  { id:'cmo-fsd', n:'10', title:'CMO FSD', sub:'Penjelasan coloring warna' },
  { id:'ancab', n:'11', title:'ANCAB', sub:'Antar cabang' },
  { id:'rrp', n:'12', title:'RRP', sub:'3 budget: NKA, dist, pruning. Perlu cek dari PIC' },
  { id:'bcp', n:'13', title:'Detail BCP', sub:'Untuk program' },
  { id:'shi', n:'14', title:'SHI', sub:'About SHI' },
  { id:'tbp', n:'15', title:'TBP', sub:'About TBP' },
  { id:'matakar', n:'16', title:'Matakar', sub:'About Matakar' }
];

const listView = document.getElementById('listView');
const detailView = document.getElementById('detailView');
const masthead = document.getElementById('masthead');
const listEl = document.getElementById('list');
const countEl = document.getElementById('count');
const qEl = document.getElementById('q');
const clearEl = document.getElementById('clear');
const noresultEl = document.getElementById('noresult');
const detailNum = document.getElementById('detailNum');
const detailTitle = document.getElementById('detailTitle');
const detailSub = document.getElementById('detailSub');
const materiEl = document.getElementById('materi');

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const chev = '<svg class="chev" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>';

function topicById(id){
  return TOPICS.find(t => t.id === id) || null;
}

/* ---- Pencarian pintar (tanpa AI, jalan di browser) ----
   Mencari di judul, subjudul, dan ISI materi; toleran typo; paham padanan kata (stok = stock, IGR = Indogrosir). */
const STOP = new Set(['yang','di','ke','dan','dari','untuk','apa','cara','bagaimana','gimana','itu','ini','atau','dengan','adalah','saya','mau','tolong','bisa','kah','nya','the','of']);
const SYNONYM_GROUPS = [
  ['stok','stock','persediaan'], ['igr','indogrosir','indo grosir'], ['po','purchase order','pesanan','order'],
  ['retur','return','pengembalian'], ['kasir','cashier'], ['pajang','display','rak','pajangan'],
  ['daftar','listing','registrasi'], ['harga','price','diskon','potongan'], ['toko','outlet','store','gerai'],
  ['kantin','canteen'], ['gimmick','hadiah','reward','bonus'], ['pengajuan','ajuan','proposal','approval','persetujuan'],
  ['program','promo','promosi'], ['bayar','pembayaran','payment','finance','tagihan'], ['member','anggota','keanggotaan'],
  ['pasar','market','share'], ['jual','selling','penjualan','sell']
];
const norm = (str) => String(str || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();

function editDistance(a, b, max){
  if (Math.abs(a.length - b.length) > max) return max + 1;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    let rowMin = i;
    for (let j = 1; j <= b.length; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      if (cur[j] < rowMin) rowMin = cur[j];
    }
    if (rowMin > max) return max + 1;
    prev = cur;
  }
  return prev[b.length];
}

const SEARCH_INDEX = (() => {
  return TOPICS.map(t => {
    const tpl = document.querySelector('template[data-materi="' + t.id + '"]');
    let body = '';
    if (tpl) {
      const frag = tpl.content;
      const parts = [];
      const walker = document.createTreeWalker(frag, NodeFilter.SHOW_TEXT);
      while (walker.nextNode()) parts.push(walker.currentNode.nodeValue);
      body = parts.join(' ') + ' ' + Array.from(frag.querySelectorAll('img')).map(i => i.alt).join(' ');
    }
    body = body.replace(/\s+/g, ' ').trim();
    const fields = { title: norm(t.title), sub: norm(t.sub), body: norm(body) };
    const words = {};
    for (const k in fields) words[k] = new Set(fields[k].split(' ').filter(Boolean));
    return { topic: t, body, bodyLower: body.toLowerCase(), words };
  });
})();

function expandToken(tok){
  const variants = new Set([tok]);
  for (const g of SYNONYM_GROUPS) {
    const gn = g.map(norm);
    if (gn.includes(tok)) gn.forEach(x => x.split(' ').forEach(w => w && variants.add(w)));
  }
  return [...variants];
}

// skor satu kata kueri terhadap satu bidang; kembalikan {score, hit} (hit = kata di indeks yang cocok)
function scoreWord(variant, wordSet, weight){
  let best = { score: 0, hit: null };
  const tol = variant.length >= 8 ? 2 : variant.length >= 5 ? 1 : 0;
  for (const w of wordSet) {
    let sc = 0;
    if (w === variant) sc = 3;
    else if (variant.length >= 3 && w.startsWith(variant)) sc = 2;
    else if (variant.length >= 4 && w.length >= 4 && editDistance(variant, w, tol) <= tol && tol > 0) sc = 1.2;
    if (sc * weight > best.score) best = { score: sc * weight, hit: w };
  }
  return best;
}

function searchTopics(rawQuery){
  let toks = norm(rawQuery).split(' ').filter(Boolean);
  const meaningful = toks.filter(t => !STOP.has(t));
  if (meaningful.length) toks = meaningful;
  if (!toks.length) return { items: SEARCH_INDEX.map(e => ({ topic: e.topic })), approx: false };

  const evaluate = (entry) => {
    let total = 0, matched = 0;
    const hits = new Set();     // semua kata yang cocok (termasuk padanan)
    const primary = new Set();  // kata yang cocok langsung dengan yang diketik
    let inBody = false;
    for (const tok of toks) {
      let tokBest = 0;
      for (const v of expandToken(tok)) {
        for (const [field, weight] of [['title', 6], ['sub', 3], ['body', 1]]) {
          const r = scoreWord(v, entry.words[field], weight);
          if (r.score > tokBest) tokBest = r.score;
          if (r.score > 0) {
            hits.add(r.hit);
            if (v === tok) primary.add(r.hit);
            if (field === 'body') inBody = true;
          }
        }
      }
      if (tokBest > 0) { matched++; total += tokBest; }
    }
    return { entry, total, matched, hits, primary, inBody };
  };

  const all = SEARCH_INDEX.map(evaluate);
  let res = all.filter(r => r.matched === toks.length);
  let approx = false;
  if (!res.length && toks.length > 1) {
    res = all.filter(r => r.matched > 0 && r.matched >= Math.ceil(toks.length / 2));
    approx = res.length > 0;
  }
  res.sort((a, b) => b.total - a.total || a.entry.topic.n.localeCompare(b.entry.topic.n));
  return { items: res.map(r => ({ topic: r.entry.topic, snippet: makeSnippet(r.entry, r.primary.size ? r.primary : r.hits), inBody: r.inBody })), approx };
}

function makeSnippet(entry, hits){
  if (!hits.size) return '';
  const alt = [...hits].filter(Boolean).map(h => h.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|');
  const m = new RegExp('(' + alt + ')', 'i').exec(entry.bodyLower);
  if (!m) return '';
  const start = Math.max(0, m.index - 55), end = Math.min(entry.body.length, m.index + m[0].length + 80);
  const before = entry.body.slice(start, m.index), word = entry.body.slice(m.index, m.index + m[0].length), after = entry.body.slice(m.index + m[0].length, end);
  return (start > 0 ? '...' : '') + esc(before) + '<mark>' + esc(word) + '</mark>' + esc(after) + (end < entry.body.length ? '...' : '');
}

let lastSearch = { items: [], approx: false };
function filteredTopics(){
  const q = qEl.value.trim();
  lastSearch = q ? searchTopics(q) : { items: TOPICS.map(t => ({ topic: t })), approx: false };
  return lastSearch.items.map(i => i.topic);
}

function renderList(){
  filteredTopics();
  const items = lastSearch.items;
  listEl.innerHTML = items.map(({ topic: t, snippet }) => `
    <a class="topic" href="#/${t.id}">
      <span class="num">${t.n}</span>
      <span class="body">
        <span class="title">${esc(t.title)}</span>
        <span class="sub">${esc(t.sub)}</span>
        ${snippet ? `<span class="snip">${snippet}</span>` : ''}
      </span>
      ${chev}
    </a>
  `).join('');

  const total = TOPICS.length;
  countEl.innerHTML = (items.length === total ? total + ' topik' : items.length + ' dari ' + total + ' topik')
    + (lastSearch.approx ? ' <span class="approx">(hasil mendekati)</span>' : '');
  clearEl.hidden = qEl.value.length === 0;

  const hasQuery = qEl.value.trim().length > 0;
  noresultEl.hidden = items.length > 0 || !hasQuery;
  if (!noresultEl.hidden) {
    noresultEl.innerHTML = 'Tidak ada topik yang cocok dengan <b></b>. Coba kata lain.';
    noresultEl.querySelector('b').textContent = qEl.value.trim();
  }
}

function templateHasContent(tpl){
  return Array.from(tpl.content.childNodes).some(node => {
    if (node.nodeType === 1) return true;
    if (node.nodeType === 3) return node.textContent.trim().length > 0;
    return false;
  });
}

function emptyState(){
  return `
    <div class="empty">
      <p class="empty-title">Materi belum diisi.</p>
      <p class="empty-copy">Bagian ini masih kosong. Isi panduan bisa ditambahkan kapan saja.</p>
      <a class="empty-link" href="#/">Kembali ke daftar topik</a>
    </div>
  `;
}

function showDetail(topic){
  masthead.hidden = true;
  listView.hidden = true;
  detailView.hidden = false;
  document.title = topic.title + ' - Guideline';

  detailNum.textContent = 'Topik ' + topic.n;
  detailTitle.textContent = topic.title;
  detailSub.textContent = topic.sub;
  materiEl.replaceChildren();

  const tpl = document.querySelector('template[data-materi="' + topic.id + '"]');
  if (tpl && templateHasContent(tpl)) {
    materiEl.appendChild(tpl.content.cloneNode(true));
  } else {
    materiEl.innerHTML = emptyState();
  }

  window.scrollTo(0, 0);
  detailTitle.focus({ preventScroll: true });
}

function showList(){
  masthead.hidden = false;
  detailView.hidden = true;
  listView.hidden = false;
  document.title = 'Guideline - Keluarga Sultan';
  renderList();
}

function route(){
  const match = location.hash.match(/^#\/(.+)$/);
  const topic = match ? topicById(decodeURIComponent(match[1])) : null;
  if (topic) showDetail(topic);
  else showList();
}

qEl.addEventListener('input', renderList);
clearEl.addEventListener('click', () => {
  qEl.value = '';
  renderList();
  qEl.focus();
});
qEl.addEventListener('keydown', e => {
  if (e.key === 'Escape' && qEl.value) {
    qEl.value = '';
    renderList();
  }
});
/* Pratinjau gambar (lightbox) */
const lb = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');
const lbScroll = document.getElementById('lbScroll');
const lbCloseBtn = document.getElementById('lbClose');
let lbOpen = false;
let lbTrigger = null;
function openLb(src, alt, trigger){
  lbTrigger = trigger || null;
  lbImg.src = src;
  lbImg.alt = alt || '';
  lb.hidden = false;
  lbScroll.scrollTop = 0; lbScroll.scrollLeft = 0;
  document.body.style.overflow = 'hidden';
  history.pushState({ lb: 1 }, '', location.href);   // tombol Back di HP menutup pratinjau, bukan keluar halaman
  lbOpen = true;
  lbCloseBtn.focus();
}
function hideLb(){
  lb.hidden = true;
  lbOpen = false;
  document.body.style.overflow = '';
  lbImg.removeAttribute('src');
  if (lbTrigger) lbTrigger.focus({ preventScroll: true });
}
function closeLb(){
  if (!lbOpen) return;
  if (history.state && history.state.lb) history.back();
  else hideLb();
}
materiEl.addEventListener('click', e => {
  const a = e.target.closest('figure.shot a');
  if (!a) return;
  e.preventDefault();
  const img = a.querySelector('img');
  openLb(a.getAttribute('href'), img ? img.alt : '', a);
});
lbCloseBtn.addEventListener('click', closeLb);
window.addEventListener('popstate', () => { if (lbOpen) hideLb(); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (lbOpen) { closeLb(); return; }
  if (!detailView.hidden) location.hash = '#/';
});
window.addEventListener('hashchange', route);

route();
</script>
</body>
</html>
